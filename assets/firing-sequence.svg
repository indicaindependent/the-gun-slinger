<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">THE FIRING SEQUENCE</title><desc id="d">How one chamber is selected and mounted, and the two conditions under which the mechanism refuses to fire.</desc><rect width="1180" height="560" fill="#0B1015"/><text x="48" y="56" font-size="26" fill="#F3F7F9" text-anchor="start" font-weight="700" letter-spacing="1.5">THE FIRING SEQUENCE</text><text x="48" y="84" font-size="15" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">Selection is mechanical. Refusal is the default, not the exception.</text><rect x="48" y="150" width="168" height="96" rx="10" fill="#161E27" stroke="#33424F" stroke-width="1.5"/><circle cx="72" cy="176" r="13" fill="#0B1015" stroke="#2DD4E8" stroke-width="1.8"/><text x="72" y="181" font-size="13" fill="#2DD4E8" text-anchor="middle" font-weight="700" letter-spacing="0">1</text><text x="92" y="181" font-size="14" fill="#F3F7F9" text-anchor="start" font-weight="700" letter-spacing="0">TRIGGER</text><text x="64" y="210" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">Incoming task text</text><path d="M 218 198 L 236 198" stroke="#33424F" stroke-width="2"/><path d="M 231 193 L 238 198 L 231 203 Z" fill="#33424F"/><rect x="240" y="150" width="168" height="96" rx="10" fill="#161E27" stroke="#33424F" stroke-width="1.5"/><circle cx="264" cy="176" r="13" fill="#0B1015" stroke="#2DD4E8" stroke-width="1.8"/><text x="264" y="181" font-size="13" fill="#2DD4E8" text-anchor="middle" font-weight="700" letter-spacing="0">2</text><text x="284" y="181" font-size="14" fill="#F3F7F9" text-anchor="start" font-weight="700" letter-spacing="0">ROUTE</text><text x="256" y="210" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">Match against the roster</text><path d="M 410 198 L 428 198" stroke="#33424F" stroke-width="2"/><path d="M 423 193 L 430 198 L 423 203 Z" fill="#33424F"/><rect x="432" y="150" width="168" height="96" rx="10" fill="#161E27" stroke="#33424F" stroke-width="1.5"/><circle cx="456" cy="176" r="13" fill="#0B1015" stroke="#2DD4E8" stroke-width="1.8"/><text x="456" y="181" font-size="13" fill="#2DD4E8" text-anchor="middle" font-weight="700" letter-spacing="0">3</text><text x="476" y="181" font-size="14" fill="#F3F7F9" text-anchor="start" font-weight="700" letter-spacing="0">READ TITLE</text><text x="448" y="210" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">From the roster, never rec</text><text x="448" y="226" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">alled</text><path d="M 602 198 L 620 198" stroke="#33424F" stroke-width="2"/><path d="M 615 193 L 622 198 L 615 203 Z" fill="#33424F"/><rect x="624" y="150" width="168" height="96" rx="10" fill="#161E27" stroke="#33424F" stroke-width="1.5"/><circle cx="648" cy="176" r="13" fill="#0B1015" stroke="#2DD4E8" stroke-width="1.8"/><text x="648" y="181" font-size="13" fill="#2DD4E8" text-anchor="middle" font-weight="700" letter-spacing="0">4</text><text x="668" y="181" font-size="14" fill="#F3F7F9" text-anchor="start" font-weight="700" letter-spacing="0">FRESHNESS</text><text x="640" y="210" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">Is the brief dated and liv</text><text x="640" y="226" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">e?</text><path d="M 794 198 L 812 198" stroke="#33424F" stroke-width="2"/><path d="M 807 193 L 814 198 L 807 203 Z" fill="#33424F"/><rect x="816" y="150" width="168" height="96" rx="10" fill="#161E27" stroke="#2DD4E8" stroke-width="2"/><circle cx="840" cy="176" r="13" fill="#0B1015" stroke="#2DD4E8" stroke-width="1.8"/><text x="840" y="181" font-size="13" fill="#2DD4E8" text-anchor="middle" font-weight="700" letter-spacing="0">5</text><text x="860" y="181" font-size="14" fill="#F3F7F9" text-anchor="start" font-weight="700" letter-spacing="0">MOUNT</text><text x="832" y="210" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">One chamber, identical fra</text><text x="832" y="226" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">ming</text><path d="M 986 198 L 1004 198" stroke="#33424F" stroke-width="2"/><path d="M 999 193 L 1006 198 L 999 203 Z" fill="#33424F"/><rect x="1008" y="150" width="168" height="96" rx="10" fill="#161E27" stroke="#2DD4E8" stroke-width="2"/><circle cx="1032" cy="176" r="13" fill="#0B1015" stroke="#2DD4E8" stroke-width="1.8"/><text x="1032" y="181" font-size="13" fill="#2DD4E8" text-anchor="middle" font-weight="700" letter-spacing="0">6</text><text x="1052" y="181" font-size="14" fill="#F3F7F9" text-anchor="start" font-weight="700" letter-spacing="0">FIRE</text><text x="1024" y="210" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">Answer as that expert</text><rect x="624" y="308" width="360" height="120" rx="10" fill="#2A1B22" stroke="#FB7185" stroke-width="2"/><text x="644" y="338" font-size="15" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0.6">REFUSE — FAIL CLOSED</text><text x="644" y="364" font-size="12.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">No brief, or the brief has expired.</text><text x="644" y="384" font-size="12.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">The chamber does not fire and says so.</text><text x="644" y="408" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">An expired brief that still fires does so</text><text x="644" y="424" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">while believing it is current.</text><path d="M 708 246 L 708 308" stroke="#FB7185" stroke-width="2" stroke-dasharray="6 5"/><path d="M 703 300 L 708 307 L 713 300 Z" fill="#FB7185"/><rect x="48" y="308" width="552" height="120" rx="10" fill="#161E27" stroke="#33424F" stroke-width="1.5"/><text x="70" y="338" font-size="14" fill="#F5A524" text-anchor="start" font-weight="700" letter-spacing="0">THE MOUNT PIN — identical for every chamber</text><text x="70" y="366" font-size="12.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">The title is read from the roster, never recalled.</text><text x="70" y="390" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">On one occasion four titles were proposed from memory</text><text x="70" y="408" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">and three of them did not exist.</text><rect x="48" y="488" width="1084" height="52" rx="14" fill="#161E27" stroke="#33424F" stroke-width="1.5"/><text x="70" y="520" font-size="13" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">An invented title is cosplay by definition, and it reads as authoritative — which is exactly what makes it dangerous.</text></svg>